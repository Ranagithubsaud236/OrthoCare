<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="Poppins, Segoe UI, Arial, sans-serif">
  <title>Normal hip joint compared with a hip joint affected by arthritis</title>
  <defs>
    <radialGradient id="bone" cx="45%" cy="35%" r="75%">
      <stop offset="0" stop-color="#fbf1d8"/>
      <stop offset="0.6" stop-color="#eed9a9"/>
      <stop offset="1" stop-color="#d9bb7f"/>
    </radialGradient>
    <radialGradient id="head" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fdf5e2"/>
      <stop offset="1" stop-color="#dcc085"/>
    </radialGradient>
    <radialGradient id="inflame" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e5533d" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#e5533d" stop-opacity="0"/>
    </radialGradient>

    <!-- Right hip, front view. Femoral head centred at (150,235). -->
    <path id="pelvis" d="M100 205 C70 170 55 120 80 85 C120 35 250 15 330 45 C370 60 385 100 365 140 C345 180 305 205 285 240 C305 255 335 262 362 275 C388 288 388 322 365 334 C350 342 345 360 330 380 C312 405 280 425 245 430 C215 434 186 428 180 405 C175 380 190 340 196 300 C200 280 196 262 186 250 C180 215 150 188 112 196 C106 198 103 201 100 205 Z"/>
    <path id="femur" d="M128 220 C112 232 98 246 86 258 C80 246 64 242 50 252 C36 262 38 300 50 322 C58 336 64 352 66 376 L72 520 L140 520 L138 392 C138 378 146 368 160 362 C170 357 168 344 156 342 C146 340 142 326 146 312 C152 296 166 284 176 270 Z"/>
  </defs>

  <rect width="1000" height="680" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-size="34" font-weight="700" fill="#0d3b3f">Hip Arthritis</text>

  <!-- ========== LEFT: NORMAL HIP ========== -->
  <g transform="translate(70 70)">
    <g stroke="#b48a4e" stroke-width="2.5" stroke-linejoin="round">
      <use href="#pelvis" fill="url(#bone)"/>
      <ellipse cx="272" cy="368" rx="34" ry="27" fill="#ffffff"/>
      <use href="#femur" fill="url(#bone)"/>
    </g>
    <!-- smooth, even cartilage lining the socket and covering the head -->
    <path d="M97 228 A54 54 0 1 1 201 252" fill="none" stroke="#8cc3e6" stroke-width="12" stroke-linecap="round"/>
    <circle cx="150" cy="235" r="44" fill="url(#head)" stroke="#b48a4e" stroke-width="2.5"/>
    <path d="M110 218 A44 44 0 0 1 190 218" fill="none" stroke="#b9dcf1" stroke-width="7" stroke-linecap="round"/>

    <g stroke="#4a5a5c" stroke-width="1.8" fill="#4a5a5c">
      <line x1="150" y1="175" x2="60" y2="70"/><circle cx="150" cy="175" r="4"/>
    </g>
    <g font-size="20" fill="#0d3b3f" font-weight="500">
      <text x="-40" y="40">Healthy</text><text x="-40" y="64">cartilage</text>
    </g>
    <text x="150" y="580" text-anchor="middle" font-size="24" font-weight="600" fill="#1f6b70">Normal hip joint</text>
  </g>

  <!-- ========== RIGHT: ARTHRITIC HIP ========== -->
  <g transform="translate(560 70)">
    <g stroke="#b48a4e" stroke-width="2.5" stroke-linejoin="round">
      <use href="#pelvis" fill="url(#bone)"/>
      <ellipse cx="272" cy="368" rx="34" ry="27" fill="#ffffff"/>
      <use href="#femur" fill="url(#bone)"/>
      <!-- bone spurs on the socket rim and head -->
      <path d="M101 204 l-16 -4 l9 15 Z" fill="url(#bone)"/>
      <path d="M186 262 l16 6 l-13 10 Z" fill="url(#bone)"/>
    </g>
    <ellipse cx="150" cy="215" rx="70" ry="45" fill="url(#inflame)"/>
    <!-- thin, patchy, worn cartilage -->
    <path d="M97 228 A54 54 0 1 1 201 252" fill="none" stroke="#8cc3e6" stroke-width="7" stroke-linecap="round" stroke-dasharray="22 16 14 22 30 18"/>
    <ellipse cx="150" cy="238" rx="45" ry="40" fill="url(#head)" stroke="#b48a4e" stroke-width="2.5"/>
    <!-- rough worn surface on the head -->
    <path d="M114 214 l8 -6 l6 5 l8 -8 l7 6 l9 -6 l7 7 l8 -5 l9 9" fill="none" stroke="#b07f3f" stroke-width="2" stroke-linejoin="round"/>
    <g fill="#d9534f" opacity="0.7">
      <ellipse cx="172" cy="196" rx="12" ry="5"/>
      <ellipse cx="132" cy="193" rx="9" ry="4"/>
    </g>

    <g stroke="#4a5a5c" stroke-width="1.8" fill="#4a5a5c">
      <line x1="172" y1="190" x2="250" y2="-5"/><circle cx="172" cy="190" r="4"/>
      <line x1="88" y1="203" x2="-25" y2="175"/><circle cx="88" cy="203" r="4"/>
    </g>
    <g font-size="20" fill="#0d3b3f" font-weight="500">
      <text x="230" y="-40">Damaged</text><text x="230" y="-16">cartilage</text>
      <text x="-115" y="168">Bone</text><text x="-115" y="192">spurs</text>
    </g>
    <text x="150" y="580" text-anchor="middle" font-size="24" font-weight="600" fill="#1f6b70">Hip joint with arthritis</text>
  </g>

  <!-- shared labels: Pelvis (top) and Femur (bottom) -->
  <g stroke="#4a5a5c" stroke-width="1.8" fill="#4a5a5c">
    <line x1="466" y1="120" x2="365" y2="160"/><circle cx="365" cy="160" r="4"/>
    <line x1="534" y1="120" x2="855" y2="160"/><circle cx="855" cy="160" r="4"/>
    <line x1="466" y1="540" x2="176" y2="530"/><circle cx="176" cy="530" r="4"/>
    <line x1="534" y1="540" x2="666" y2="530"/><circle cx="666" cy="530" r="4"/>
  </g>
  <g font-size="22" fill="#0d3b3f" font-weight="600" text-anchor="middle">
    <text x="500" y="127">Pelvis</text>
    <text x="500" y="547">Femur</text>
  </g>
</svg>
